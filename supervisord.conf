[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================
; STORAGE LAYER
; ============================================================

[program:postgresql]
command=/usr/lib/postgresql/13/bin/postgres -D /data/pgdata -c listen_addresses=* -c log_min_messages=warning
user=postgres
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

[program:minio]
command=/usr/local/bin/minio server /data/minio --console-address :9001
environment=MINIO_ROOT_USER="admin",MINIO_ROOT_PASSWORD="password",MINIO_BROWSER_REDIRECT_URL="http://localhost:5173/services/datalake"
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

; ============================================================
; PROCESSING LAYER
; ============================================================

[program:iceberg-rest]
command=java -jar /opt/iceberg-rest/iceberg-rest-adapter.jar
environment=AWS_ACCESS_KEY_ID="admin",AWS_SECRET_ACCESS_KEY="password",AWS_REGION="us-east-1",CATALOG_WAREHOUSE="s3://warehouse/wh/",CATALOG_IO__IMPL="org.apache.iceberg.aws.s3.S3FileIO",CATALOG_S3_ENDPOINT="http://localhost:9000",CATALOG_S3_PATH_STYLE_ACCESS="true",CATALOG_S3_PATH__STYLE__ACCESS="true"
autostart=true
autorestart=true
priority=25
startsecs=5
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

[program:jupyter]
command=jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
directory=/home/iceberg
environment=AWS_ACCESS_KEY_ID="admin",AWS_SECRET_ACCESS_KEY="password",AWS_REGION="us-east-1",AWS_DEFAULT_REGION="us-east-1",AWS_S3_PATH_STYLE_ACCESS="true",PYSPARK_DRIVER_PYTHON="jupyter",PYSPARK_DRIVER_PYTHON_OPTS="lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root"
autostart=true
autorestart=true
priority=30
startsecs=8
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

; ============================================================
; ORCHESTRATION LAYER
; ============================================================

[program:airflow-webserver]
command=airflow webserver --port 8085
environment=AIRFLOW__CORE__EXECUTOR="SequentialExecutor",AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="sqlite:////data/airflow/airflow.db",AIRFLOW__CORE__LOAD_EXAMPLES="False",AIRFLOW__WEBSERVER__X_FRAME_ENABLED="True",AIRFLOW__WEBSERVER__X_FRAME_OPTIONS="ALLOWALL",AIRFLOW__WEBSERVER__AUTH_ROLE_PUBLIC="Admin",AIRFLOW__WEBSERVER__BASE_URL="http://localhost:5173/services/airflow",AIRFLOW_HOME="/data/airflow",POSTGRES_HOST="localhost",POSTGRES_DB="synapse_dw",POSTGRES_USER="postgres",POSTGRES_PASSWORD="password",AIRFLOW_CONN_POSTGRES_DW_CONN="postgres://postgres:password@localhost:5432/synapse_dw"
autostart=true
autorestart=true
priority=40
startsecs=10
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

[program:airflow-scheduler]
command=airflow scheduler
environment=AIRFLOW__CORE__EXECUTOR="SequentialExecutor",AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="sqlite:////data/airflow/airflow.db",AIRFLOW__CORE__LOAD_EXAMPLES="False",AIRFLOW__WEBSERVER__AUTH_ROLE_PUBLIC="Admin",AIRFLOW_HOME="/data/airflow",POSTGRES_HOST="localhost",POSTGRES_DB="synapse_dw",POSTGRES_USER="postgres",POSTGRES_PASSWORD="password",AIRFLOW_CONN_POSTGRES_DW_CONN="postgres://postgres:password@localhost:5432/synapse_dw"
autostart=true
autorestart=true
priority=45
startsecs=8
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

; ============================================================
; WAREHOUSE LAYER
; ============================================================

[program:pgadmin]
command=/opt/pgadmin4/venv/bin/python3 /opt/pgadmin4/venv/lib/python3.10/site-packages/pgadmin4/pgAdmin4.py
environment=PGADMIN_DEFAULT_EMAIL="pgadmin4@pgadmin.org",PGADMIN_DEFAULT_PASSWORD="password",PGADMIN_CONFIG_SERVER_MODE="False",PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED="False",SCRIPT_NAME="/services/synapse",PGADMIN_LISTEN_PORT="5050"
autostart=true
autorestart=true
priority=75
startsecs=5
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

; ============================================================
; STREAMING LAYER
; ============================================================

[program:redpanda]
command=/opt/redpanda/bin/redpanda --redpanda-cfg /etc/redpanda/redpanda.yaml
autostart=true
autorestart=true
priority=50
startsecs=5
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

[program:redpanda-console]
command=/opt/redpanda-console/console
environment=KAFKA_BROKERS="localhost:9092",SERVER_LISTENPORT="8081",SERVER_BASEPATH="/services/eventhub"
autostart=true
autorestart=true
priority=55
startsecs=3
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
autostart=true
autorestart=true
priority=60
startsecs=8
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

; ============================================================
; MONITORING LAYER
; ============================================================

[program:grafana]
command=/opt/grafana/bin/grafana server --homepath=/opt/grafana --config=/opt/grafana/conf/defaults.ini
environment=GF_SECURITY_ALLOW_EMBEDDING="true",GF_AUTH_ANONYMOUS_ENABLED="true",GF_AUTH_ANONYMOUS_ORG_ROLE="Admin",GF_AUTH_ANONYMOUS_ORG_NAME="Main Org.",GF_SERVER_ROOT_URL="http://localhost:5173/services/monitoring",GF_SERVER_SERVE_FROM_SUB_PATH="true",GF_SERVER_HTTP_PORT="3010",GF_PATHS_DATA="/data/grafana",GF_PATHS_LOGS="/var/log/grafana"
autostart=true
autorestart=true
priority=70
startsecs=5
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

; ============================================================
; PORTAL LAYER
; ============================================================

[program:portal-backend]
command=uvicorn main:app --host 0.0.0.0 --port 8000
directory=/opt/portal-backend
autostart=true
autorestart=true
priority=80
startsecs=3
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=90
startsecs=2
stdout_logfile=/var/log/%(program_name)s.log
stderr_logfile=/var/log/%(program_name)s_err.log
